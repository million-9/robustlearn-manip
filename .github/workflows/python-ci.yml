name: Python CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy robustlearn

      - name: Pytest
        run: uv run pytest
