[project]
name = "robustlearn-manip"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "gymnasium>=1.3.0",
    "mujoco>=3.12.0",
    "numpy>=2.5.2",
    "PyYAML>=6.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=8,<9",
    "ruff>=0.16.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["robustlearn*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"ros2_ws/src/robustlearn_control/scripts/keyboard_teleop.py" = ["I001"]
"ros2_ws/src/robustlearn_control/scripts/local_insertion_expert.py" = ["I001"]
"ros2_ws/src/robustlearn_control/test/test_keyboard_teleop_launch.py" = ["I001"]
"ros2_ws/src/robustlearn_control/test/test_local_insertion_expert_nominal_launch.py" = ["I001"]
"ros2_ws/src/robustlearn_control/test/test_local_insertion_expert_timeout_launch.py" = ["I001"]
"ros2_ws/src/robustlearn_control/test/test_local_insertion_expert_arming_launch.py" = ["I001"]
"ros2_ws/src/robustlearn_moveit_config/scripts/hybrid_insertion_coordinator.py" = ["I001"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.mypy.overrides]]
module = ["mujoco"]
ignore_missing_imports = true
